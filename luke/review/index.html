<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Review this week's newsletter — SMRT</title>
<meta name="theme-color" content="#faf9f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f8; --ink:#1e2a3a; --navy:#073b70; --red:#7a2a1a;
    --muted:#6b778c; --border:#e8e5e0; --white:#fff; --green:#1a6b4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  body{font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;padding-bottom:120px;}
  .wrap{max-width:680px;margin:0 auto;padding:22px 18px 8px;}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);margin:0 0 10px;}
  .banner{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:18px 20px;margin:0 0 18px;
  }
  .banner h1{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em;}
  .banner .meta{font-size:13px;color:var(--muted);font-weight:500;}
  .pill{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;margin-top:12px;
    background:#fff7ed;color:var(--red);border:1px solid #f3d9c9;
  }
  .pill.ok{background:#eaf4ee;color:var(--green);border-color:#c9e3d3;}
  .draft{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:8px 18px 22px;min-height:120px;
  }
  .loading{color:var(--muted);text-align:center;padding:52px 0;font-size:14px;}
  /* sticky action bar */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(250,249,248,.86);backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-top:1px solid var(--border);
  }
  .bar-inner{max-width:680px;margin:0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;}
  button{
    font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;
    padding:14px 16px;border:1px solid transparent;flex:1;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
  }
  .approve{background:var(--navy);color:#fff;box-shadow:0 1px 2px rgba(7,59,112,.25);}
  .approve:hover{box-shadow:0 6px 18px rgba(7,59,112,.28);}
  .revise{background:var(--white);color:var(--ink);border-color:var(--border);flex:0 0 auto;padding-left:20px;padding-right:20px;}
  .revise:hover{border-color:#cdc8c0;}
  button:active{transform:translateY(1px) scale(.99);}
  button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}
  /* revision sheet */
  .sheet{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:18px;margin:18px 0 4px;
  }
  .sheet h2{font-size:14px;font-weight:700;margin:0 0 4px;}
  .sheet p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5;}
  textarea{
    width:100%;min-height:120px;resize:vertical;font-family:inherit;font-size:15px;line-height:1.5;
    color:var(--ink);background:#fcfbfa;border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  }
  textarea:focus{outline:none;border-color:var(--navy);background:#fff;}
  .sheet-actions{display:flex;gap:10px;margin-top:12px;}
  .send-rev{background:var(--red);color:#fff;flex:1;}
  .cancel{background:transparent;color:var(--muted);border-color:var(--border);flex:0 0 auto;}
  /* result */
  .result{
    text-align:center;padding:40px 24px;background:var(--white);
    border:1px solid var(--border);border-radius:14px;margin-top:18px;
    animation:rise .28s ease both;
  }
  .result .icon{width:46px;height:46px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;}
  .result.approved .icon{background:#eaf4ee;color:var(--green);}
  .result.revised .icon{background:#fdeee6;color:var(--red);}
  .result h2{font-size:18px;font-weight:700;margin:0 0 6px;}
  .result p{font-size:14px;color:var(--muted);margin:0;line-height:1.55;}
  .hide{display:none !important;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">SMRT · Newsletter approval</p>

    <div id="banner" class="banner hide">
      <h1 id="subject">Weekly Market Update</h1>
      <div class="meta" id="weekmeta"></div>
      <span id="statuspill" class="pill">Awaiting your approval</span>
    </div>

    <div id="stage">
      <div class="draft"><div id="smrt-draft"><div class="loading">Loading this week's draft…</div></div></div>
    </div>

    <!-- revision sheet -->
    <div id="sheet" class="sheet hide">
      <h2>What should change?</h2>
      <p>Tell SMRT what to fix and it'll rewrite the draft, then send it back to you for another look.</p>
      <textarea id="feedback" placeholder="e.g. Lead with the pending-sales number, trim the intro, and add a line about new-construction inventory."></textarea>
      <div class="sheet-actions">
        <button class="cancel" id="cancelRev" type="button">Cancel</button>
        <button class="send-rev" id="sendRev" type="button">Send for revision</button>
      </div>
    </div>
  </div>

  <!-- sticky actions -->
  <div id="bar" class="bar hide">
    <div class="bar-inner">
      <button class="revise" id="reviseBtn" type="button">✍️ Needs revision</button>
      <button class="approve" id="approveBtn" type="button">✓ Approve &amp; send</button>
    </div>
  </div>

<script>
(function(){
  var SUPA = "https://kfoijgcbkjeizxxyiwxv.supabase.co/functions/v1";
  var qs = new URLSearchParams(location.search);
  var token = (qs.get("t") || qs.get("token") || "").trim();

  var el = function(id){ return document.getElementById(id); };
  var bar = el("bar"), banner = el("banner"), stage = el("stage"), sheet = el("sheet");

  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function weekLabel(ymd){
    var m = String(ymd||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return "";
    var d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    return "Week of " + MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function showError(msg){
    stage.innerHTML = '<div class="draft"><div class="loading">' + msg + '</div></div>';
  }
  function showResult(kind, title, body){
    bar.classList.add("hide"); sheet.classList.add("hide");
    var icon = kind === "approved" ? "✓" : "✍️";
    stage.innerHTML = '<div class="result ' + kind + '"><div class="icon">' + icon + '</div>' +
      '<h2>' + title + '</h2><p>' + body + '</p></div>';
  }

  function embedDraft(newsletterId){
    var s = document.createElement("script");
    s.src = SUPA + "/newsletter-embed?t=" + encodeURIComponent(newsletterId) + "&target=smrt-draft";
    s.async = true;
    document.body.appendChild(s);
  }

  function paintStatus(st){
    var pill = el("statuspill");
    if(st === "approved"){ pill.textContent = "Approved — sends Tuesday"; pill.className = "pill ok"; }
    else if(st === "revision_requested"){ pill.textContent = "Revision in progress"; pill.className = "pill"; }
    else { pill.textContent = "Awaiting your approval"; pill.className = "pill"; }
  }

  function api(action, body){
    var opts = { method: body ? "POST" : "GET", headers: {} };
    if(body){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(SUPA + "/newsletter-approval?action=" + action, opts).then(function(r){ return r.json(); });
  }

  if(!token){ showError("This link is missing its approval code. Please use the link from your text."); return; }

  // 1) Load status + draft
  api("status", null).then(function(d){
    if(!d || !d.ok){ showError("We couldn't find this newsletter. The link may have expired."); return; }
    el("subject").textContent = d.subject_line || "Weekly Market Update";
    el("weekmeta").textContent = weekLabel(d.week_start_date);
    banner.classList.remove("hide");
    paintStatus(d.approval_status);
    if(d.newsletter_id) embedDraft(d.newsletter_id);

    if(d.approval_status === "revision_requested"){
      showResult("revised", "Revision requested", "SMRT is rewriting this newsletter now. You'll get a fresh draft to review shortly — nothing sends until you approve it.");
      return;
    }
    // pending_approval OR approved: show actions (approved can still be changed)
    bar.classList.remove("hide");
    if(d.approval_status === "approved"){
      el("approveBtn").textContent = "✓ Approved";
      el("approveBtn").disabled = true;
    }
  }).catch(function(){ showError("Something went wrong loading the draft. Please try again."); });

  // helper for the token in the body
  function withToken(extra){ var o = { token: token }; for(var k in extra) o[k] = extra[k]; return o; }

  // 2) Approve
  el("approveBtn").addEventListener("click", function(){
    var b = this; b.disabled = true; b.textContent = "Approving…";
    api("approve", withToken({})).then(function(d){
      if(d && d.ok){
        showResult("approved", "Approved 🎉", "This newsletter is locked in and will go out Tuesday morning. Thanks for the quick look.");
      } else { b.disabled = false; b.textContent = "✓ Approve & send"; alert("Couldn't approve — please try again."); }
    }).catch(function(){ b.disabled = false; b.textContent = "✓ Approve & send"; });
  });

  // 3) Needs revision -> reveal sheet
  el("reviseBtn").addEventListener("click", function(){
    sheet.classList.remove("hide");
    sheet.scrollIntoView({ behavior: "smooth", block: "center" });
    el("feedback").focus();
  });
  el("cancelRev").addEventListener("click", function(){ sheet.classList.add("hide"); });

  // 4) Submit revision
  el("sendRev").addEventListener("click", function(){
    var fb = (el("feedback").value || "").trim();
    if(!fb){ el("feedback").focus(); return; }
    var b = this; b.disabled = true; b.textContent = "Sending…";
    api("revise", withToken({ feedback: fb })).then(function(d){
      if(d && d.ok){
        showResult("revised", "Got it — revising now", "SMRT will rewrite the draft with your notes and text you a fresh version to review. Nothing sends until you approve it.");
      } else { b.disabled = false; b.textContent = "Send for revision"; alert("Couldn't send — please try again."); }
    }).catch(function(){ b.disabled = false; b.textContent = "Send for revision"; });
  });
})();
</script>
</body>
</html>
