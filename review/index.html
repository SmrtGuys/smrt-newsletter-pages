<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign off this week's newsletter</title>
<meta name="theme-color" content="#faf9f8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f8; --ink:#1e2a3a; --navy:#073b70; --red:#7a2a1a;
    --muted:#6b778c; --border:#e8e5e0; --white:#fff; --green:#1a6b4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  body{font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;padding-bottom:120px;}
  .wrap{max-width:680px;margin:0 auto;padding:22px 18px 8px;}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);margin:0 0 10px;}
  .banner{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:18px 20px;margin:0 0 18px;
  }
  .banner h1{font-size:19px;font-weight:700;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em;}
  .banner .meta{font-size:13px;color:var(--muted);font-weight:500;}
  .pill{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;margin-top:12px;
    background:#fff7ed;color:var(--red);border:1px solid #f3d9c9;
  }
  .pill.ok{background:#eaf4ee;color:var(--green);border-color:#c9e3d3;}
  .draft{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:0;min-height:120px;overflow:hidden;
  }
  .draft iframe{display:block;width:100%;border:0;min-height:480px;background:#fff;}
  .note{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.5;}
  .loading{color:var(--muted);text-align:center;padding:52px 0;font-size:14px;}
  /* sticky action bar */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(250,249,248,.86);backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-top:1px solid var(--border);
  }
  .bar-inner{max-width:680px;margin:0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;}
  button{
    font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;
    padding:14px 16px;border:1px solid transparent;flex:1;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
  }
  .approve{background:var(--navy);color:#fff;box-shadow:0 1px 2px rgba(7,59,112,.25);}
  .approve:hover{box-shadow:0 6px 18px rgba(7,59,112,.28);}
  .revise{background:var(--white);color:var(--ink);border-color:var(--border);flex:0 0 auto;padding-left:20px;padding-right:20px;}
  .revise:hover{border-color:#cdc8c0;}
  .hold{background:var(--white);color:var(--red);border-color:#f3d9c9;flex:0 0 auto;padding-left:16px;padding-right:16px;}
  .hold:hover{border-color:#e9c3ad;background:#fffaf7;}
  button:active{transform:translateY(1px) scale(.99);}
  button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}
  /* revision sheet */
  .sheet{
    background:var(--white);border:1px solid var(--border);border-radius:14px;
    padding:18px;margin:18px 0 4px;
  }
  .sheet h2{font-size:14px;font-weight:700;margin:0 0 4px;}
  .sheet p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5;}
  textarea{
    width:100%;min-height:120px;resize:vertical;font-family:inherit;font-size:15px;line-height:1.5;
    color:var(--ink);background:#fcfbfa;border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  }
  textarea:focus{outline:none;border-color:var(--navy);background:#fff;}
  .sheet-actions{display:flex;gap:10px;margin-top:12px;}
  .send-rev{background:var(--red);color:#fff;flex:1;}
  .cancel{background:transparent;color:var(--muted);border-color:var(--border);flex:0 0 auto;}
  /* result */
  .result{
    text-align:center;padding:40px 24px;background:var(--white);
    border:1px solid var(--border);border-radius:14px;margin-top:18px;
    animation:rise .28s ease both;
  }
  .result .icon{width:46px;height:46px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;}
  .result.approved .icon{background:#eaf4ee;color:var(--green);}
  .result.revised .icon{background:#fdeee6;color:var(--red);}
  .result.held .icon{background:#fdeee6;color:var(--red);}
  .result h2{font-size:18px;font-weight:700;margin:0 0 6px;}
  .result p{font-size:14px;color:var(--muted);margin:0;line-height:1.55;}
  .hide{display:none !important;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">SMRT &middot; Newsletter sign-off</p>

    <div id="banner" class="banner hide">
      <h1 id="subject">Weekly Market Update</h1>
      <div class="meta" id="weekmeta"></div>
      <span id="statuspill" class="pill">Waiting on your sign-off</span>
    </div>

    <div id="stage">
      <div class="draft"><div class="loading">Loading this week's issue&hellip;</div></div>
    </div>
    <p id="note" class="note hide">This is the email exactly as it goes out. Want changes? Reply to the text with what you'd change.</p>
  </div>

  <div id="bar" class="bar hide">
    <div class="bar-inner">
      <button class="hold" id="holdBtn" type="button">Hold this week</button>
      <button class="approve" id="approveBtn" type="button">&#10003; Approve &amp; send</button>
    </div>
  </div>

<script>
(function(){
  var FN = "https://fhxnzsqxbfclerivryrt.supabase.co/functions/v1/newsletter-review";
  var token = (new URLSearchParams(location.search).get("t") || "").trim();
  var el = function(id){ return document.getElementById(id); };
  var stage = el("stage"), bar = el("bar"), banner = el("banner"), note = el("note");
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function weekLabel(ymd){
    var m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return "";
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return "Issue for the week of " + MONTHS[d.getMonth()] + " " + d.getDate();
  }
  function message(text){
    stage.innerHTML = '<div class="draft"><div class="loading"></div></div>';
    stage.querySelector(".loading").textContent = text;
  }
  function result(kind, title, body){
    var box = document.createElement("div");
    box.className = "result " + kind;
    var icon = document.createElement("div"); icon.className = "icon"; icon.textContent = kind === "approved" ? "\u2713" : "\u23F8";
    var h = document.createElement("h2"); h.textContent = title;
    var p = document.createElement("p"); p.textContent = body;
    box.appendChild(icon); box.appendChild(h); box.appendChild(p);
    var old = document.querySelector(".result"); if(old) old.remove();
    stage.parentNode.insertBefore(box, note);
  }
  function paint(d){
    var pill = el("statuspill");
    var approve = el("approveBtn"), hold = el("holdBtn");
    approve.disabled = false; hold.disabled = false;
    approve.textContent = "\u2713 Approve & send";
    hold.textContent = "Hold this week";
    if(d.signed_off){
      pill.textContent = "Signed off. Sends Tuesday 8:30am"; pill.className = "pill ok";
      approve.textContent = "\u2713 Approved"; approve.disabled = true;
    } else if(d.held){
      pill.textContent = "Held. Not sending this week"; pill.className = "pill";
      hold.disabled = true; approve.textContent = "\u2713 Send it after all";
    } else {
      pill.textContent = "Waiting on your sign-off"; pill.className = "pill";
    }
  }
  function showEmail(html){
    var frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-same-origin allow-popups allow-popups-to-escape-sandbox");
    frame.setAttribute("title", "This week's newsletter");
    frame.srcdoc = html;
    frame.addEventListener("load", function(){
      try {
        var doc = frame.contentDocument;
        var fit = function(){ frame.style.height = Math.max(480, doc.documentElement.scrollHeight) + "px"; };
        fit(); setTimeout(fit, 300); setTimeout(fit, 1200);
        Array.prototype.forEach.call(doc.querySelectorAll("a[href]"), function(a){ a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); });
      } catch(e) {}
    });
    var box = document.createElement("div"); box.className = "draft";
    box.appendChild(frame);
    stage.innerHTML = ""; stage.appendChild(box);
  }
  function act(action){
    var approve = el("approveBtn"), hold = el("holdBtn");
    approve.disabled = true; hold.disabled = true;
    return fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: token, action: action }) })
      .then(function(r){ return r.json().then(function(d){ return { status: r.status, d: d }; }); });
  }

  if(!/^[0-9a-f]{64}$/.test(token)){ message("This link is missing its code. Please use the link from your text."); return; }

  fetch(FN + "?t=" + encodeURIComponent(token)).then(function(r){
    return r.json().then(function(d){ return { status: r.status, d: d }; });
  }).then(function(res){
    var d = res.d || {};
    if(res.status === 410){ message("This link has expired. This week's issue is already past its send time."); return; }
    if(!d.ok){ message("We couldn't find this issue. The link may have expired."); return; }
    el("subject").textContent = d.subject_line || "Weekly Market Update";
    el("weekmeta").textContent = weekLabel(d.week_start_date);
    banner.classList.remove("hide");
    if(d.revision_in_progress){ message("A revision is in progress. You'll get a fresh link to sign off once it's ready."); return; }
    if(!d.html){ message("The preview couldn't be built (" + (d.render_error || "unknown") + "). Nothing will send until it's fixed."); return; }
    showEmail(d.html);
    note.classList.remove("hide");
    bar.classList.remove("hide");
    paint(d);
  }).catch(function(){ message("Something went wrong loading the issue. Please try again."); });

  el("approveBtn").addEventListener("click", function(){
    var b = this; b.textContent = "Signing off\u2026";
    act("approve").then(function(res){
      if(res.d && res.d.ok){
        paint({ signed_off: true });
        result("approved", "Signed off", "It goes out Tuesday at 8:30am. A copy is on its way to your inbox too.");
      } else {
        paint({}); alert(res.status === 410 ? "This link has expired." : "Couldn't sign off. Please try again.");
      }
    }).catch(function(){ paint({}); alert("Couldn't sign off. Please try again."); });
  });
  el("holdBtn").addEventListener("click", function(){
    var b = this; b.textContent = "Holding\u2026";
    act("hold").then(function(res){
      if(res.d && res.d.ok){
        paint({ held: true });
        result("held", "Held", "Nothing goes out this week. Changed your mind? Tap Send it after all.");
      } else {
        paint({}); alert(res.status === 410 ? "This link has expired." : "Couldn't hold. Please try again.");
      }
    }).catch(function(){ paint({}); alert("Couldn't hold. Please try again."); });
  });
})();
</script>
</body>
</html>
